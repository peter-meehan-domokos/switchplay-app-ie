name: Verify Next.js production build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          MONGODB_URI: ""
          MONGODB_DB: ""
          NEXT_TELEMETRY_DISABLED: "1"
