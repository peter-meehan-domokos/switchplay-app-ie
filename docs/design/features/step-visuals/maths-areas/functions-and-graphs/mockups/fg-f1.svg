<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="810" viewBox="0 0 1000 810" role="img" aria-labelledby="title desc"><title id="title">FG-F1: Composition: output becomes input</title><desc id="desc">The intermediate value stays visible. Later graph mode uses the same relay without a formula. Static design sketch showing two selected states. Read the learning plan for the full interaction.</desc><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect x="0" y="0" width="1000" height="810" rx="0" fill="#f0f5f3" stroke="none"/><text x="40.00" y="40.00" font-size="25" fill="#193234" font-weight="700" text-anchor="start">FG-F1  /  Composition: output becomes input</text><text x="40.00" y="67.00" font-size="12" fill="#7b8b8c" font-weight="600" text-anchor="start">ANNOTATED DESIGN SKETCH · selected states, not a production screen</text><rect x="40" y="95" width="440" height="638" rx="22" fill="white" stroke="#ccdcd8"/><text x="64.00" y="128.00" font-size="17" fill="#087f78" font-weight="700" text-anchor="start">A permitted input</text><text x="64.00" y="158.00" font-size="16" fill="#193234" font-weight="400" text-anchor="start">Send 7 through g, then f.</text><text x="96.00" y="264.00" font-size="13" fill="#7b8b8c" font-weight="600" text-anchor="start">INPUT</text><rect x="240" y="243" width="184" height="51" rx="10" fill="#f0f7f5" stroke="#b7d4cf"/><text x="334.00" y="276.00" font-size="21" fill="#087f78" font-weight="600" text-anchor="middle">7</text><line x1="334.00" y1="297.00" x2="334.00" y2="324.00" stroke="#7b8b8c" stroke-width="2"/><text x="350.00" y="319.00" font-size="20" fill="#7b8b8c" font-weight="400" text-anchor="start">↓</text><text x="96.00" y="352.00" font-size="13" fill="#7b8b8c" font-weight="600" text-anchor="start">g(x)=x−3</text><rect x="240" y="331" width="184" height="51" rx="10" fill="#f0f7f5" stroke="#b7d4cf"/><text x="334.00" y="364.00" font-size="21" fill="#087f78" font-weight="600" text-anchor="middle">4</text><line x1="334.00" y1="385.00" x2="334.00" y2="412.00" stroke="#7b8b8c" stroke-width="2"/><text x="350.00" y="407.00" font-size="20" fill="#7b8b8c" font-weight="400" text-anchor="start">↓</text><text x="96.00" y="440.00" font-size="13" fill="#7b8b8c" font-weight="600" text-anchor="start">f(x)=√x</text><rect x="240" y="419" width="184" height="51" rx="10" fill="#f0f7f5" stroke="#b7d4cf"/><text x="334.00" y="452.00" font-size="21" fill="#087f78" font-weight="600" text-anchor="middle">2</text><text x="64.00" y="539.00" font-size="16" fill="#193234" font-weight="600" text-anchor="start">f(g(x))=√(x−3)</text><rect x="64" y="572" width="392" height="40" rx="10" fill="#eef6f3" stroke="#c4dbd5"/><text x="260.00" y="597.00" font-size="14" fill="#087f78" font-weight="600" text-anchor="middle">Input x = 7</text><text x="64.00" y="643.00" font-size="15" fill="#193234" font-weight="400" text-anchor="start">The intermediate value 4 becomes the next</text><text x="64.00" y="664.00" font-size="15" fill="#193234" font-weight="400" text-anchor="start">input.</text><text x="64.00" y="710.00" font-size="12" fill="#7b8b8c" font-weight="400" text-anchor="start">Previous</text><text x="456.00" y="710.00" font-size="12" fill="#087f78" font-weight="600" text-anchor="end">Next →</text><rect x="520" y="95" width="440" height="638" rx="22" fill="white" stroke="#ccdcd8"/><text x="544.00" y="128.00" font-size="17" fill="#087f78" font-weight="700" text-anchor="start">An input that fails later</text><text x="544.00" y="158.00" font-size="16" fill="#193234" font-weight="400" text-anchor="start">Try 2 in the same composition.</text><text x="576.00" y="264.00" font-size="13" fill="#7b8b8c" font-weight="600" text-anchor="start">INPUT</text><rect x="720" y="243" width="184" height="51" rx="10" fill="#f0f7f5" stroke="#b7d4cf"/><text x="814.00" y="276.00" font-size="21" fill="#087f78" font-weight="600" text-anchor="middle">2</text><line x1="814.00" y1="297.00" x2="814.00" y2="324.00" stroke="#7b8b8c" stroke-width="2"/><text x="830.00" y="319.00" font-size="20" fill="#7b8b8c" font-weight="400" text-anchor="start">↓</text><text x="576.00" y="352.00" font-size="13" fill="#7b8b8c" font-weight="600" text-anchor="start">g(x)=x−3</text><rect x="720" y="331" width="184" height="51" rx="10" fill="#f0f7f5" stroke="#b7d4cf"/><text x="814.00" y="364.00" font-size="21" fill="#087f78" font-weight="600" text-anchor="middle">−1</text><line x1="814.00" y1="385.00" x2="814.00" y2="412.00" stroke="#7b8b8c" stroke-width="2"/><text x="830.00" y="407.00" font-size="20" fill="#7b8b8c" font-weight="400" text-anchor="start">↓</text><text x="576.00" y="440.00" font-size="13" fill="#7b8b8c" font-weight="600" text-anchor="start">f(x)=√x</text><rect x="720" y="419" width="184" height="51" rx="10" fill="#f0f7f5" stroke="#b7d4cf"/><text x="814.00" y="452.00" font-size="21" fill="#b76d13" font-weight="600" text-anchor="middle">Undefined</text><text x="544.00" y="539.00" font-size="16" fill="#193234" font-weight="600" text-anchor="start">g(2)=−1; f cannot accept −1</text><rect x="544" y="572" width="392" height="40" rx="10" fill="#eef6f3" stroke="#c4dbd5"/><text x="740.00" y="597.00" font-size="14" fill="#087f78" font-weight="600" text-anchor="middle">Input x = 2</text><text x="544.00" y="643.00" font-size="15" fill="#193234" font-weight="400" text-anchor="start">The first function works; the second rejects</text><text x="544.00" y="664.00" font-size="15" fill="#193234" font-weight="400" text-anchor="start">its output.</text><text x="544.00" y="710.00" font-size="12" fill="#7b8b8c" font-weight="400" text-anchor="start">Previous</text><text x="936.00" y="710.00" font-size="12" fill="#087f78" font-weight="600" text-anchor="end">Next →</text><text x="40.00" y="765.00" font-size="13" fill="#7b8b8c" font-weight="400" text-anchor="start">The intermediate value stays visible. Later graph mode uses the same relay without a formula.</text></svg>