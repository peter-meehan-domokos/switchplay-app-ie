height="38" rx="12" fill="#f0f7f5" stroke="#bfd7d2"/><text x="832.88" y="377.50" font-size="17" fill="#193234" font-weight="600" text-anchor="middle">4</text><rect x="808.88" y="456.0" width="48" height="38" rx="12" fill="#f0f7f5" stroke="#bfd7d2"/><text x="832.88" y="480.00" font-size="17" fill="#193234" font-weight="600" text-anchor="middle">7</text><text x="544.00" y="539.00" font-size="16" fill="#193234" font-weight="600" text-anchor="start">2 maps to 4 and to 7</text><rect x="544" y="572" width="392" height="40" rx="10" fill="#eef6f3" stroke="#c4dbd5"/><text x="740.00" y="597.00" font-size="14" fill="#087f78" font-weight="600" text-anchor="middle">Choose an arrow to remove</text><text x="544.00" y="643.00" font-size="15" fill="#193234" font-weight="400" text-anchor="start">One permitted input needs exactly one</text><text x="544.00" y="664.00" font-size="15" fill="#193234" font-weight="400" text-anchor="start">output.</text><text x="544.00" y="710.00" font-size="12" fill="#7b8b8c" font-weight="400" text-anchor="start">Previous</text><text x="936.00" y="710.00" font-size="12" fill="#087f78" font-weight="600" text-anchor="end">Next →</text><text x="40.00" y="765.00" font-size="13" fill="#7b8b8c" font-weight="400" text-anchor="start">Mapping buttons provide the primary action; arrows explain the relationship.</text></svg>