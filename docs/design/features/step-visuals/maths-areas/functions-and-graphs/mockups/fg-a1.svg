<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="810" viewBox="0 0 1000 810" role="img" aria-labelledby="title desc"><title id="title">FG-A1: One input, one output</title><desc id="desc">Mapping buttons provide the primary action; arrows explain the relationship. Static design sketch showing two selected states. Read the learning plan for the full interaction.</desc><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect x="0" y="0" width="1000" height="810" rx="0" fill="#f0f5f3" stroke="none"/><text x="40.00" y="40.00" font-size="25" fill="#193234" font-weight="700" text-anchor="start">FG-A1  /  One input, one output</text><text x="40.00" y="67.00" font-size="12" fill="#7b8b8c" font-weight="600" text-anchor="start">ANNOTATED DESIGN SKETCH · selected states, not a production screen</text><rect x="40" y="95" width="440" height="638" rx="22" fill="white" stroke="#ccdcd8"/><text x="64.00" y="128.00" font-size="17" fill="#087f78" font-weight="700" text-anchor="start">Trace a valid function</text><text x="64.00" y="158.00" font-size="16" fill="#193234" font-weight="400" text-anchor="start">Tap −2, then 2. Follow the arrows.</text><text x="167.12" y="233.00" font-size="13" fill="#7b8b8c" font-weight="600" text-anchor="middle">Inputs</text><text x="352.88" y="233.00" font-size="13" fill="#7b8b8c" font-weight="600" text-anchor="middle">Codomain</text><line x1="190.12" y1="270.00" x2="329.88" y2="372.50" stroke="#087f78" stroke-width="2.2"/><path d="M 322.88 368.5 L 329.88 372.5 L 322.88 376.5" fill="none" stroke="#087f78" stroke-width="2"/><line x1="190.12" y1="372.50" x2="329.88" y2="270.00" stroke="#087f78" stroke-width="2.2"/><path d="M 322.88 266.0 L 329.88 270.0 L 322.88 274.0" fill="none" stroke="#087f78" stroke-width="2"/><line x1="190.12" y1="475.00" x2="329.88" y2="372.50" stroke="#087f78" stroke-width="2.2"/><path d="M 322.88 368.5 L 329.88 372.5 L 322.88 376.5" fill="none" stroke="#087f78" stroke-width="2"/><rect x="143.12" y="251.0" width="4